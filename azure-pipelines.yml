trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  acrName: certifyacrpmwst7bkkpgrc
  imageName: certify-api
  containerAppName: certify-api
  resourceGroup: RG-Josef-Al-Husseini-e0aa81-DotNetCloudDeveloper-VT-Mars-Goteborg

steps:
  - task: DotNetCoreCLI@2
    displayName: 'Build API'
    inputs:
      command: build
      projects: 'src/Api/Api.csproj'
      arguments: '--configuration Release'

  - task: DotNetCoreCLI@2
    displayName: 'Run tests'
    inputs:
      command: test
      projects: '**/*Tests.csproj'

  - task: AzureCLI@2
    displayName: 'Build and push image to ACR'
    inputs:
      azureSubscription: 'azure-connection'
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        az acr build --registry $(acrName) --image $(imageName):$(Build.BuildId) --image $(imageName):latest --file Dockerfile .

  - task: AzureCLI@2
    displayName: 'Deploy to Container Apps'
    inputs:
      azureSubscription: 'azure-connection'
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        az containerapp update --name $(containerAppName) --resource-group $(resourceGroup) --image $(acrName).azurecr.io/$(imageName):$(Build.BuildId)
